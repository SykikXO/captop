name: Build and Deploy

on:
  push:
    tags: [ "v*" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/captop-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/captop-server:${{ github.sha }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            if docker ps --format "{{.Names}}" | grep -q "^captop-server$"; then
              mkdir -p /tmp/malformed-dump
              docker cp captop-server:/app/malformed /tmp/malformed-dump/
              mkdir -p malformed
              rsync -av /tmp/malformed-dump/malformed/ ./malformed/
              rm -rf /tmp/malformed-dump
            fi
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/captop-server:latest
            # Stop first to cancel restart policy, then remove
            docker stop captop-server 2>/dev/null || true
            docker rm -f captop-server 2>/dev/null || true
            # Run the new container
            docker run -d \
              --name captop-server \
              -p 3000:3000 \
              -e PORT=3000 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/captop-server:latest
            # Health check — retry up to 10 times (30s total)
            for i in $(seq 1 10); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "Health check passed on attempt $i"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "Health check failed after 10 attempts"
                docker logs captop-server
                exit 1
              fi
              echo "Waiting for container... attempt $i"
              sleep 3
            done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-and-deploy
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write Chrome signing key
        run: echo "${{ secrets.CHROME_PEM }}" > captop-chrome.pem

      - name: Package extensions
        run: |
          chmod +x package_extensions.sh
          ./package_extensions.sh "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            captop-chrome.crx
            captop-chrome-${{ github.ref_name }}.zip
            captop-firefox-${{ github.ref_name }}.zip
          generate_release_notes: true
